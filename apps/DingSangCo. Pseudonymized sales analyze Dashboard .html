<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鼎盛銷售經營診斷儀表板</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#0B0F19;color:#E5E7EB;font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.g{background:rgba(31,41,55,.6);border:1px solid rgba(55,65,81,.5);border-radius:14px;backdrop-filter:blur(6px)}
.kc{cursor:pointer;transition:all .2s}.kc:hover{transform:translateY(-4px);border-color:#3B82F6;box-shadow:0 0 18px rgba(59,130,246,.35)}
.kc.on{border-color:#3B82F6;background:rgba(59,130,246,.16);box-shadow:0 0 22px rgba(59,130,246,.45)}
select{background:#111827;border:1px solid #374151;border-radius:8px;padding:3px 6px;font-size:12px;max-width:100%;color:#E5E7EB}
#panel{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,15,25,.94);backdrop-filter:blur(8px);border-bottom:1px solid #1F2937}
td,th{padding:4px 8px;font-size:12px;text-align:right}th:first-child,td:first-child{text-align:left}
</style></head>
<body>
<div class="hd px-4 py-3">
 <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
  <h1 class="text-lg font-bold">鼎盛銷售經營診斷儀表板 <span id="src" class="text-xs font-normal text-amber-400 ml-2"></span></h1>
  <label id="drop" class="text-xs px-3 py-1.5 rounded-lg border border-dashed border-blue-500 text-blue-300 cursor-pointer">⬆ 拖曳或點選上傳 .xlsx / .csv<input id="file" type="file" accept=".xlsx,.xls,.csv" class="hidden"></label>
 </div>
 <div id="filters" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 xl:grid-cols-12 gap-2 text-xs"></div>
</div>
<main class="p-4 max-w-[1500px] mx-auto">
 <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-3"></div>
 <div id="panel" class="mt-4"></div>
</main>
<script>
const $=s=>document.querySelector(s),sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0),
grp=(a,f)=>{const m=new Map();a.forEach(x=>{const k=f(x);(m.get(k)||m.set(k,[]).get(k)).push(x)});return m},
n0=v=>Math.round(v).toLocaleString('zh-TW'),pc=v=>(v*100).toFixed(1)+'%',
ab=v=>Math.abs(v)>=1e8?(v/1e8).toFixed(2)+' 億':Math.abs(v)>=1e4?(v/1e4).toFixed(0)+' 萬':n0(v),
dv=(a,b)=>b?a/b:0;
Chart.defaults.color='#9CA3AF';Chart.defaults.borderColor='rgba(75,85,99,.35)';Chart.defaults.maintainAspectRatio=false;
const C={b:'#3B82F6',g:'#10B981',o:'#F59E0B',r:'#EF4444',p:'#A78BFA',c:'#22D3EE'},PAL=[C.b,C.g,C.o,C.r,C.p,C.c];
let D=[],T=[],STD={},S={f:{},k:0},CH={};

/* ---------- Mock data engine ---------- */
function mock(){
 let s=42;const R=()=>(s=(s*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(R()*a.length)];
 const P=[['雲端主機方案','雲端服務',12000,.35],['備份儲存方案','雲端服務',4500,.30],['資安監控雲','雲端服務',9000,.38],['系統導入顧問','顧問服務',30000,.60],['教育訓練','顧問服務',30000,.62],['流程優化顧問','顧問服務',45000,.58],
  ['ERP 授權','軟體授權',60000,.25],['BI 授權','軟體授權',25000,.30],['資安授權','軟體授權',18000,.28],['伺服器','硬體設備',80000,.72],['網路設備','硬體設備',35000,.70],['工作站','硬體設備',50000,.74]]
  .map((p,i)=>({id:'P'+String(i+1).padStart(3,'0'),name:p[0],line:p[1],list:p[2],scr:p[3]}));
 P.forEach(p=>STD[p.id]=p.scr);
 const regs=['北區','中區','南區','東區'],reps=Array.from({length:16},(_,i)=>({n:'業務'+String.fromCharCode(65+i),r:regs[Math.floor(i/4)]})),
 inds=['科技業','製造業','教育','醫療照護','金融業','零售'],gr=['A 戰略','B 重點','C 一般'],
 cs=Array.from({length:120},(_,i)=>({n:'客戶'+(i+1),g:i<12?gr[0]:i<48?gr[1]:gr[2],ind:pick(inds),reg:pick(regs)})),
 tags=['運輸偏遠','外包成本超支','競品議價','專案急件','策略客戶特批'];
 const yms=[];for(let y=2025;y<=2026;y++)for(let m=1;m<=(y==2026?6:12);m++)yms.push(y+'-'+String(m).padStart(2,'0'));
 D=[];
 for(let i=0;i<820;i++){
  const ym=pick(yms),p=pick(P),rp=pick(reps),c=R()<.45?pick(cs.slice(0,12)):pick(cs),qty=1+Math.floor(R()*(p.list>30000?8:25)),
  tg=R()<.18?pick(tags):'無',disc=Math.min(.35,R()*(c.g[0]=='A'?.3:.18)+(tg=='競品議價'?.12:0)),price=p.list*(1-disc),rev=price*qty,
  dc=rev*(p.scr*(0.8+R()*.4))/(1-disc>0?1:1)*(1-disc)/(1-disc*.5),lc=rev*(.01+R()*.03)*(tg=='運輸偏遠'?4:1),sc=rev*(.01+R()*.04)*(c.g[0]=='C'&&R()<.3?3:1),
  pcst=tg=='外包成本超支'?rev*(.15+R()*.2):tg=='專案急件'?rev*(.08+R()*.1):0,cost=dc+lc+sc+pcst,gp=rev-cost,
  appr=(disc>.2&&R()<.25)?'未核准':'已核准',rt=R();
  D.push({id:'SO'+i,ym,yr:+ym.slice(0,4),q:'Q'+Math.ceil(+ym.slice(5)/3),cust:c.n,grade:c.g,ind:c.ind,prod:p.name,pid:p.id,line:p.line,rep:rp.n,rreg:rp.r,
   ch:pick(['直銷','經銷','線上詢價']),type:pick(['新客','續約','加購','續約']),qty,list:p.list,disc,rev,dc,lc,sc,pc:pcst,gp,appr,tag:tg,loss:gp<0,
   pay:Math.floor(20+R()*80+(c.g[0]=='A'?20:0)),ret:rt<.82?'正常':rt<.93?'部分退貨':'已退貨'});
 }
 T=[];yms.forEach(ym=>reps.forEach(r=>{const a=sum(D.filter(d=>d.ym==ym&&d.rep==r.n),d=>d.rev);T.push({ym,yr:+ym.slice(0,4),q:'Q'+Math.ceil(+ym.slice(5)/3),rep:r.n,rreg:r.r,t:Math.round((a||4e5)*(0.85+R()*.4)/1e4)*1e4,nt:3})}));
}
/* ---------- File loader ---------- */
const strip=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k.replace(/\(NT\$\)/,'').trim(),v]));
function load(buf,src){
 const wb=XLSX.read(buf,{type:'array'}),nm=wb.SheetNames,rd=n=>XLSX.utils.sheet_to_json(wb.Sheets[n]).map(strip),
 sd=nm.find(n=>/銷售|明細/.test(n))||nm[0],st=nm.find(n=>/目標/.test(n)),sp=nm.find(n=>/產品/.test(n));
 const rows=rd(sd);if(!rows.length||rows[0]['營收']===undefined){alert('找不到「營收」欄位，請確認為銷售明細表');return}
 D=rows.map(o=>({id:o['訂單ID'],ym:String(o['年月']),yr:+o['年'],q:o['季'],cust:o['客戶名稱'],grade:o['客戶等級'],ind:o['客戶產業'],prod:o['產品名稱'],pid:o['產品ID'],line:o['產品線'],rep:o['業務員'],rreg:o['業務負責區域'],ch:o['銷售通路'],type:o['訂單類型'],qty:+o['數量'],list:+o['牌價單價'],disc:+o['折扣率'],rev:+o['營收'],dc:+o['直接成本'],lc:+o['物流成本'],sc:+o['售後服務成本'],pc:+o['專案額外成本'],gp:+o['毛利'],appr:o['折扣核准'],tag:o['異常原因標籤']||'無',loss:o['是否虧損']==='是',pay:+o['付款天數'],ret:o['退貨狀態']}));
 STD={};if(sp)rd(sp).forEach(p=>STD[p['產品ID']]=+p['標準成本率']);
 T=st?rd(st).map(o=>({ym:String(o['年月']),yr:+o['年'],q:o['季'],rep:o['業務員'],rreg:o['業務負責區域'],t:+o['營收目標'],nt:+o['新客目標(筆)']||0})):[];
 $('#src').textContent='資料來源：'+src+'（'+D.length+' 筆）';S.f={};init();
}
async function onFile(f){if(f){const b=await f.arrayBuffer();load(new Uint8Array(b),f.name)}}
$('#file').onchange=e=>onFile(e.target.files[0]);
['dragover','drop'].forEach(ev=>document.body.addEventListener(ev,e=>{e.preventDefault();if(ev=='drop')onFile(e.dataTransfer.files[0])}));

/* ---------- Filters ---------- */
const FS=[['yr','年度',r=>r.yr],['q','季度',r=>r.q],['rreg','負責區域',r=>r.rreg],['rep','業務員',r=>r.rep],['grade','客戶等級',r=>r.grade],['ind','客戶產業',r=>r.ind],['line','產品線',r=>r.line],['ch','銷售通路',r=>r.ch],['type','訂單類型',r=>r.type],['tag','異常標籤',r=>r.tag],['risk','風險過濾',null]];
function init(){
 const el=$('#filters');el.innerHTML='';
 FS.forEach(([k,l,g])=>{const w=document.createElement('div');w.innerHTML=`<div class="text-gray-400 mb-0.5">${l}</div><select id="f_${k}"></select>`;el.append(w);
  w.querySelector('select').onchange=e=>{S.f[k]=e.target.value;if(k=='rreg'){S.f.rep='';fill('rep')}render()}});
 const w=document.createElement('div');w.innerHTML='<div class="text-gray-400 mb-0.5">月份起</div><select id="f_m1"></select>';el.append(w);
 const w2=document.createElement('div');w2.innerHTML='<div class="text-gray-400 mb-0.5">月份迄</div><select id="f_m2"></select>';el.append(w2);
 const ms=[...new Set(D.map(r=>r.ym))].sort();
 ['m1','m2'].forEach((k,i)=>{const s=$('#f_'+k);s.innerHTML='<option value="">不限</option>'+ms.map(m=>`<option>${m}</option>`).join('');s.onchange=e=>{S.f[k]=e.target.value;render()}});
 FS.forEach(([k])=>fill(k));render();
}
function fill(k){
 const s=$('#f_'+k),g=(FS.find(x=>x[0]==k)||[])[2];
 if(k=='risk'){s.innerHTML='<option value="">全部訂單</option><option value="loss">僅虧損訂單</option><option value="un">僅未核准折扣</option>';return}
 let src=D;if(k=='rep'&&S.f.rreg)src=D.filter(r=>r.rreg==S.f.rreg);
 const v=[...new Set(src.map(g))].filter(x=>x!==undefined).sort();
 s.innerHTML='<option value="">全部</option>'+v.map(x=>`<option>${x}</option>`).join('');s.value=S.f[k]||'';
}
function filt(){
 const f=S.f;
 const base=r=>FS.every(([k,,g])=>!g||!f[k]||String(g(r))==f[k])&&(!f.m1||r.ym>=f.m1)&&(!f.m2||r.ym<=f.m2);
 const F=D.filter(r=>base(r)&&(f.risk!='loss'||r.loss)&&(f.risk!='un'||r.appr=='未核准'));
 const TT=T.filter(r=>(!f.yr||r.yr==f.yr)&&(!f.q||r.q==f.q)&&(!f.rreg||r.rreg==f.rreg)&&(!f.rep||r.rep==f.rep)&&(!f.m1||r.ym>=f.m1)&&(!f.m2||r.ym<=f.m2));
 return[F,TT];
}
const fsum=()=>FS.map(([k,l])=>S.f[k]?`${l}=${S.f[k]}`:'').concat([S.f.m1?'起 '+S.f.m1:'',S.f.m2?'迄 '+S.f.m2:'']).filter(Boolean).map(x=>x.replace('risk','風險').replace('=loss','=僅虧損').replace('=un','=僅未核准')).join('　|　')||'無（顯示全部資料）';

/* ---------- KPI computation ---------- */
function calc(F,TT){
 const rev=sum(F,r=>r.rev),gp=sum(F,r=>r.gp),tg=sum(TT,r=>r.t),L=F.filter(r=>r.loss),un=F.filter(r=>r.appr=='未核准'),
 rt=F.filter(r=>r.ret&&r.ret!='正常'),cu=grp(F,r=>r.cust),cr=[...cu].map(([k,a])=>sum(a,r=>r.rev)).sort((a,b)=>b-a),
 top=Math.max(1,Math.ceil(cr.length*.1)),std=dv(sum(F,r=>r.rev*(1-(STD[r.pid]??.5))),rev);
 const ms=[...new Set(F.map(r=>r.ym))].sort(),mr=m=>sum(F.filter(r=>r.ym==m),r=>r.rev),last=ms.at(-1),
 prev=ms.at(-2),yoyM=last?(+last.slice(0,4)-1)+last.slice(4):'',yo=sum(D.filter(r=>r.ym==yoyM),r=>r.rev);
 return{rev,gp,gm:dv(gp,rev),tg,ach:dv(rev,tg),mom:prev?dv(mr(last),mr(prev))-1:null,yoy:yo?dv(mr(last),yo)-1:null,std,
  nL:L.length,aL:-sum(L,r=>r.gp),rL:dv(L.length,F.length),disc:dv(sum(F,r=>r.list*r.qty-r.rev),sum(F,r=>r.list*r.qty)),nU:un.length,
  aU:sum(un,r=>Math.max(0,r.list*r.qty*(r.disc-.1))),nC:cu.size,conc:dv(cr.slice(0,top).reduce((a,b)=>a+b,0),rev),avg:dv(rev,F.length),
  nR:rt.length,rr:dv(rt.length,F.length),sv:sum(F,r=>r.sc),ms,L,un,cu,cr};
}
const col=(v,g,b)=>v>=g?'text-emerald-400':v>=b?'text-amber-400':'text-red-400';
const KP=[
 ['📊 總營收與達成率',k=>[ab(k.rev),'達成率 '+pc(k.ach),'MoM '+(k.mom==null?'–':pc(k.mom))+' / YoY '+(k.yoy==null?'–':pc(k.yoy)),col(k.ach,.95,.85)]],
 ['💰 毛利與毛利率',k=>[ab(k.gp),'毛利率 '+pc(k.gm),'標準落差 '+((k.gm-k.std)*100).toFixed(1)+' pp',col(k.gm-k.std,0,-.05)]],
 ['🚨 虧損訂單',k=>[k.nL+' 筆','虧損 '+ab(k.aL),'佔比 '+pc(k.rL),col(-k.rL,-.03,-.08)]],
 ['🏷️ 折扣與越權',k=>[pc(k.disc),'未核准 '+k.nU+' 筆','越權損失估計 '+ab(k.aU),col(-k.nU,-5,-20)]],
 ['🏢 客戶集中度',k=>[k.nC+' 戶','Top10% 集中度 '+pc(k.conc),'單筆均貢獻 '+ab(k.avg),col(-k.conc,-.4,-.6)]],
 ['📦 退貨與售後',k=>[k.nR+' 筆','退貨率 '+pc(k.rr),'售後成本 '+ab(k.sv),col(-k.rr,-.1,-.2)]]];

/* ---------- Render ---------- */
const mk=(id,cfg)=>{CH[id]?.destroy();CH[id]=new Chart($('#'+id),cfg)};
const ax=(t)=>({title:{display:!!t,text:t}});
function render(){
 Object.values(CH).forEach(c=>c.destroy());CH={};
 const[F,TT]=filt(),k=calc(F,TT);
 $('#cards').innerHTML=KP.map((p,i)=>{const[a,b,c,cl]=p[1](k);return`<div class="g kc p-4 ${S.k==i?'on':''}" onclick="S.k=${i};render()"><div class="text-sm text-gray-300">${p[0]}</div><div class="text-2xl font-bold mt-1 ${cl}">${a}</div><div class="text-xs text-gray-300 mt-1">${b}</div><div class="text-xs text-gray-500">${c}</div></div>`}).join('');
 if(!F.length){$('#panel').innerHTML='<div class="g p-6 text-center text-gray-400">目前篩選條件下無資料</div>';return}
 const P=PN[S.k](F,TT,k);
 $('#panel').innerHTML=`<div class="g p-4"><div class="font-bold text-lg mb-3">${KP[S.k][0]} — 深度診斷</div>
 <div class="grid lg:grid-cols-2 gap-4"><div><div class="text-xs text-gray-400 mb-1">${P.t1}</div><div class="h-72"><canvas id="c1"></canvas></div></div>
 <div><div class="text-xs text-gray-400 mb-1">${P.t2}</div>${P.html2||'<div class="h-72"><canvas id="c2"></canvas></div>'}</div></div>
 <div class="grid lg:grid-cols-2 gap-4 mt-4 text-sm">
  <div class="rounded-lg bg-gray-900/60 p-3"><div class="font-semibold text-blue-400 mb-1">🔎 當前篩選條件</div><div class="text-xs text-gray-300">${fsum()}　（${F.length} 筆訂單）</div>
   <div class="font-semibold text-blue-400 mt-3 mb-1">∑ 計算公式與定義</div><pre class="text-xs text-gray-300 whitespace-pre-wrap font-mono">${P.fm}</pre></div>
  <div class="rounded-lg bg-gray-900/60 p-3"><div class="font-semibold text-red-400 mb-1">🚦 異常診斷與根因分析</div><ul class="text-xs space-y-1.5">${P.dg.map(x=>`<li>${x}</li>`).join('')}</ul>
   <div class="font-semibold text-emerald-400 mt-3 mb-1">✅ 管理建議與行動方針</div><ul class="text-xs space-y-1.5 list-disc pl-4 text-gray-200">${P.rc.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>`;
 P.draw();
}
const R_='🔴 ',Y_='🟡 ',G_='🟢 ';
const PN=[
/* 1 Revenue */
(F,TT,k)=>{const ms=k.ms,by=m=>sum(F.filter(r=>r.ym==m),r=>r.rev),tm=m=>sum(TT.filter(r=>r.ym==m),r=>r.t);
 const reps=[...new Set(TT.map(r=>r.rep))].map(n=>{const a=sum(F.filter(r=>r.rep==n),r=>r.rev),t=sum(TT.filter(r=>r.rep==n),r=>r.t),nw=F.filter(r=>r.rep==n&&r.type=='新客').length,nt=sum(TT.filter(r=>r.rep==n),r=>r.nt);return{n,v:dv(a,t),nw,nt}}).sort((a,b)=>a.v-b.v);
 const rg=[...grp(F,r=>r.rreg)].map(([n,a])=>({n,v:dv(sum(a,r=>r.rev),sum(TT.filter(t=>t.rreg==n),t=>t.t))}));
 const red=reps.filter(x=>x.v<.85),cr=red.filter(x=>x.v<.8&&x.nw<x.nt),ty=grp(F,r=>r.type),sh=t=>dv(sum(ty.get(t)||[],r=>r.rev),k.rev),old=sh('續約')+sh('加購');
 return{t1:'月度營收實績 vs 目標',t2:'業務員達成率排行（紅線 = 85%）',fm:'營收達成率 = Σ訂單營收(NT$) ÷ Σ營收目標(NT$) × 100%\nMoM = 本月營收 ÷ 上月營收 − 1；YoY = 本月 ÷ 去年同月 − 1',
 dg:[k.ach<.85?R_+'整體達成率 '+pc(k.ach)+'，目標落後紅燈':G_+'整體達成率 '+pc(k.ach),
  red.length?R_+'低於 85% 業務員 '+red.length+' 位：'+red.slice(0,6).map(x=>x.n+' '+pc(x.v)).join('、'):G_+'無業務員低於 85%',
  rg.filter(x=>x.v<.85).length?R_+'落後區域：'+rg.filter(x=>x.v<.85).map(x=>x.n+' '+pc(x.v)).join('、'):G_+'各區域達成率皆 ≥ 85%',
  (old>.7?R_:G_)+`營收結構：新客 ${pc(sh('新客'))}、續約 ${pc(sh('續約'))}、加購 ${pc(sh('加購'))}；舊客（續約+加購）占 ${pc(old)}${old>.7?'，成長動能過度依賴舊客':''}`],
